<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Свечной график TradingView</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; }
        #chart { width: 100%; height: calc(100% - 100px); position: relative; }
        .loading-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.5); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="flex items-center justify-between bg-gray-800 px-4 py-3">
        <div class="text-xl font-semibold">TradingView Chart</div>
        <select id="symbolSelect" class="bg-gray-700 px-2 py-1 rounded text-white">
            <option value="BTCUSDT">BTC/USDT</option>
            <option value="ETHUSDT">ETH/USDT</option>
            <option value="BNBUSDT">BNB/USDT</option>
        </select>
    </div>
    <div class="flex justify-center bg-gray-800 py-2">
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="1m">1м</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="5m">5м</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-blue-600" data-interval="15m">15м</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="1h">1ч</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="4h">4ч</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="1d">1д</button>
    </div>
    <div id="chart">
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="text-white text-lg">Загрузка...</div>
        </div>
    </div>

    <script type="module">
        // Типизация для данных свечей
        /** @typedef {{ time: number, open: number, high: number, low: number, close: number }} Candle */

        // Кэш для данных
        const dataCache = new Map();

        // Инициализация графика
        const chartContainer = document.getElementById('chart');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
            localization: { locale: 'ru-RU' }
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
            borderVisible: false
        });

        // Прокси для обхода CORS (если нужно)
        const PROXY_URL = 'https://cors-anywhere.herokuapp.com/';
        const BINANCE_API = 'https://api.binance.com/api/v3/klines';

        // Функция для показа/скрытия загрузки
        const toggleLoading = (isLoading) => {
            loadingOverlay.classList.toggle('hidden', !isLoading);
        };

        // Функция загрузки данных
        async function loadChart(symbol, interval) {
            const cacheKey = `${symbol}-${interval}`;
            if (dataCache.has(cacheKey)) {
                const cachedData = dataCache.get(cacheKey);
                candleSeries.setData(cachedData);
                chart.timeScale().fitContent();
                return;
            }

            toggleLoading(true);
            try {
                const response = await fetch(`${BINANCE_API}?symbol=${symbol}&interval=${interval}&limit=200`, {
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const data = await response.json();

                /** @type {Candle[]} */
                const candles = data.map(d => ({
                    time: Math.floor(d[0] / 1000),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                dataCache.set(cacheKey, candles);
                candleSeries.setData(candles);
                chart.timeScale().fitContent();
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                candleSeries.setData([]);
                alert('Не удалось загрузить данные. Проверьте подключение или попробуйте позже.');
            } finally {
                toggleLoading(false);
            }
        }

        // Начальные значения
        let currentSymbol = 'BTCUSDT';
        let currentInterval = '15m';

        // Обработчик выбора символа
        document.getElementById('symbolSelect').addEventListener('change', (e) => {
            currentSymbol = e.target.value;
            loadChart(currentSymbol, currentInterval);
        });

        // Обработчик кнопок таймфрейма
        document.querySelectorAll('.timeframe-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.replace('bg-blue-600', 'bg-gray-700'));
                btn.classList.replace('bg-gray-700', 'bg-blue-600');
                currentInterval = btn.dataset.interval;
                loadChart(currentSymbol, currentInterval);
            });
        });

        // Дебouncing для resize
        const debounce = (func, wait) => {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), wait);
            };
        };

        const resizeChart = () => {
            chart.resize(chartContainer.clientWidth, chartContainer.clientHeight);
        };

        window.addEventListener('resize', debounce(resizeChart, 200));

        // Начальная загрузка
        loadChart(currentSymbol, currentInterval);
    </script>
</body>
</html>
