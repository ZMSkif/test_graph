<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoView</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* Переменные для цветов */
        :root {
            --bg-primary: #0f1729;
            --bg-secondary: #1a2538;
            --text-primary: #ffffff;
            --text-secondary: #8393ae;
            --accent: #3d78e3;
            --success: #26a69a;
            --danger: #ef5350;
            --border: #2a3652;
        }
        
        /* Сброс стилей и базовая настройка */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        
        /* Компоненты интерфейса */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 15px;
            background-color: var(--bg-primary);
            font-weight: 600;
        }
        
        .header {
            background-color: var(--bg-secondary);
            padding: 10px 0;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        
        .app-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: var(--bg-secondary);
        }
        
        .symbol-select {
            padding: 6px 12px;
            border-radius: 6px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            outline: none;
        }
        
        .timeframes {
            display: flex;
            background-color: var(--bg-primary);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .timeframe-btn {
            border: none;
            background: none;
            color: var(--text-secondary);
            padding: 6px 10px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .timeframe-btn.active {
            background-color: var(--accent);
            color: var(--text-primary);
        }
        
        #chart {
            height: calc(100% - 100px);
            width: 100%;
            position: relative;
        }
        
        .info-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(19, 31, 53, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 8px;
            z-index: 10;
            border: 1px solid var(--border);
        }
        
        .symbol-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .current-price {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .price-change {
            font-weight: 500;
        }
        
        .positive { color: var(--success); }
        .negative { color: var(--danger); }
        
        .status-message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(19, 31, 53, 0.7);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <!-- Имитация статус-бара -->
    <div class="status-bar">
        <div class="time">21:49</div>
        <div class="right">Wi-Fi 47%</div>
    </div>
    
    <!-- Заголовок приложения -->
    <div class="header">
        <h1 class="app-title">CryptoView</h1>
    </div>
    
    <!-- Элементы управления -->
    <div class="controls">
        <select id="symbolSelect" class="symbol-select">
            <option value="BTCUSDT">BTC/USDT</option>
            <option value="ETHUSDT">ETH/USDT</option>
            <option value="BNBUSDT">BNB/USDT</option>
            <option value="SOLUSDT">SOL/USDT</option>
            <option value="DOGEUSDT">DOGE/USDT</option>
        </select>
        
        <div class="timeframes">
            <button class="timeframe-btn" data-interval="1m">1м</button>
            <button class="timeframe-btn" data-interval="5m">5м</button>
            <button class="timeframe-btn active" data-interval="15m">15м</button>
            <button class="timeframe-btn" data-interval="1h">1ч</button>
            <button class="timeframe-btn" data-interval="4h">4ч</button>
            <button class="timeframe-btn" data-interval="1d">1д</button>
        </div>
    </div>
    
    <!-- Контейнер для графика -->
    <div id="chart">
        <div class="info-overlay">
            <div class="symbol-name">BTC/USDT</div>
            <div class="current-price">---.--</div>
            <div class="price-change">0.00 (0.00%)</div>
        </div>
        <div id="statusMessage" class="status-message">Загрузка данных...</div>
    </div>
    
    <script>
        /**
         * Основной модуль приложения
         */
        const App = (function() {
            // Приватные переменные
            let chart, candleSeries;
            let currentSymbol = 'BTCUSDT';
            let currentInterval = '15m';
            let webSocket = null;
            let lastCandle = null;
            
            // DOM-элементы
            const elements = {
                chartContainer: document.getElementById('chart'),
                symbolName: document.querySelector('.symbol-name'),
                currentPrice: document.querySelector('.current-price'),
                priceChange: document.querySelector('.price-change'),
                statusMessage: document.getElementById('statusMessage'),
                symbolSelect: document.getElementById('symbolSelect'),
                timeframeButtons: document.querySelectorAll('.timeframe-btn')
            };
            
            /**
             * Инициализация графика
             */
            function initChart() {
                // Настройки графика
                const chartOptions = {
                    width: elements.chartContainer.clientWidth,
                    height: elements.chartContainer.clientHeight,
                    layout: {
                        background: { color: '#0f1729' },
                        textColor: '#e6e9f0',
                    },
                    grid: {
                        vertLines: { color: 'rgba(42, 54, 82, 0.5)' },
                        horzLines: { color: 'rgba(42, 54, 82, 0.5)' }
                    },
                    crosshair: {
                        mode: LightweightCharts.CrosshairMode.Normal,
                    },
                    timeScale: {
                        timeVisible: true,
                        secondsVisible: false,
                        borderColor: '#2a3652',
                    },
                    handleScale: {
                        mouseWheel: true,
                        pinch: true
                    }
                };
                
                // Создаем график
                chart = LightweightCharts.createChart(elements.chartContainer, chartOptions);
                
                // Создаем серию свечей
                candleSeries = chart.addCandlestickSeries({
                    upColor: '#26a69a',
                    downColor: '#ef5350',
                    wickUpColor: '#26a69a',
                    wickDownColor: '#ef5350',
                    borderVisible: false
                });
                
                // Обработчик изменения размера окна
                window.addEventListener('resize', () => {
                    if (chart) {
                        chart.resize(
                            elements.chartContainer.clientWidth,
                            elements.chartContainer.clientHeight
                        );
                    }
                });
            }
            
            /**
             * Загрузка исторических данных
             */
            async function loadHistoricalData() {
                setStatus('Загрузка данных...', true);
                
                try {
                    const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${currentInterval}&limit=200`);
                    
                    if (!response.ok) {
                        throw new Error(`Ошибка HTTP: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (!data || !Array.isArray(data) || data.length === 0) {
                        throw new Error('Получены некорректные данные');
                    }
                    
                    // Преобразуем данные в формат для графика
                    const candles = data.map(d => ({
                        time: Math.floor(d[0] / 1000),
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));
                    
                    // Устанавливаем данные
                    candleSeries.setData(candles);
                    
                    // Сохраняем последнюю свечу
                    lastCandle = candles[candles.length - 1];
                    
                    // Обновляем информацию
                    updatePriceInfo(lastCandle);
                    
                    // Подключаемся к WebSocket
                    connectWebSocket();
                    
                    // Масштабируем график для отображения всех данных
                    chart.timeScale().fitContent();
                    
                    // Скрываем сообщение о загрузке
                    setStatus('', false);
                    
                } catch (error) {
                    console.error('Ошибка загрузки данных:', error);
                    setStatus('Ошибка загрузки. Попробуйте позже.', true);
                    
                    // Пробуем загрузить данные снова через 5 секунд
                    setTimeout(loadHistoricalData, 5000);
                }
            }
            
            /**
             * Подключение к WebSocket
             */
            function connectWebSocket() {
                // Закрываем предыдущее соединение, если оно есть
                if (webSocket) {
                    webSocket.close();
                }
                
                // Формируем URL для WebSocket
                const wsUrl = `wss://stream.binance.com:9443/ws/${currentSymbol.toLowerCase()}@kline_${currentInterval}`;
                
                // Создаем новое WebSocket соединение
                webSocket = new WebSocket(wsUrl);
                
                // Обработчик открытия соединения
                webSocket.onopen = () => {
                    console.log('WebSocket соединение установлено');
                };
                
                // Обработчик сообщений
                webSocket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        // Проверяем, что это данные свечи
                        if (data.k) {
                            const candle = {
                                time: Math.floor(data.k.t / 1000),
                                open: parseFloat(data.k.o),
                                high: parseFloat(data.k.h),
                                low: parseFloat(data.k.l),
                                close: parseFloat(data.k.c)
                            };
                            
                            // Обновляем текущую свечу на графике
                            candleSeries.update(candle);
                            
                            // Обновляем информацию о цене
                            updatePriceInfo(candle);
                            
                            // Обновляем последнюю свечу
                            lastCandle = candle;
                        }
                    } catch (error) {
                        console.error('Ошибка обработки сообщения WebSocket:', error);
                    }
                };
                
                // Обработчик ошибок
                webSocket.onerror = (error) => {
                    console.error('WebSocket ошибка:', error);
                    setStatus('Ошибка соединения', true);
                };
                
                // Обработчик закрытия соединения
                webSocket.onclose = () => {
                    console.log('WebSocket соединение закрыто');
                    
                    // Пробуем переподключиться через 3 секунды
                    setTimeout(connectWebSocket, 3000);
                };
            }
            
            /**
             * Обновление информации о цене
             */
            function updatePriceInfo(candle) {
                if (!candle) return;
                
                // Получаем точность отображения в зависимости от символа
                const precision = getPrecisionForSymbol(currentSymbol);
                
                // Форматируем цену
                const formattedPrice = formatPrice(candle.close, precision);
                
                // Вычисляем изменение цены
                const priceChange = candle.close - candle.open;
                const percentChange = (priceChange / candle.open) * 100;
                
                // Форматируем изменение
                const sign = priceChange >= 0 ? '+' : '';
                const formattedChange = `${sign}${formatPrice(priceChange, precision)} (${sign}${percentChange.toFixed(2)}%)`;
                
                // Обновляем элементы DOM
                elements.currentPrice.textContent = formattedPrice;
                elements.priceChange.textContent = formattedChange;
                elements.priceChange.className = `price-change ${priceChange >= 0 ? 'positive' : 'negative'}`;
            }
            
            /**
             * Получение точности для отображения цены в зависимости от символа
             */
            function getPrecisionForSymbol(symbol) {
                if (symbol.includes('BTC')) return 2;
                if (symbol.includes('ETH')) return 2;
                return 4;
            }
            
            /**
             * Форматирование цены
             */
            function formatPrice(price, precision = 2) {
                return new Intl.NumberFormat('ru-RU', {
                    minimumFractionDigits: precision,
                    maximumFractionDigits: precision
                }).format(price);
            }
            
            /**
             * Установка статусного сообщения
             */
            function setStatus(message, show = true) {
                elements.statusMessage.textContent = message;
                elements.statusMessage.style.display = show ? 'block' : 'none';
            }
            
            /**
             * Обработчик изменения символа
             */
            function handleSymbolChange(e) {
                const newSymbol = e.target.value;
                
                if (newSymbol !== currentSymbol) {
                    currentSymbol = newSymbol;
                    elements.symbolName.textContent = formatSymbolDisplay(currentSymbol);
                    
                    // Загружаем новые данные
                    loadHistoricalData();
                }
            }
            
            /**
             * Обработчик изменения временного интервала
             */
            function handleIntervalChange(e) {
                const newInterval = e.target.getAttribute('data-interval');
                
                if (newInterval !== currentInterval) {
                    // Обновляем активную кнопку
                    elements.timeframeButtons.forEach(btn => {
                        btn.classList.remove('active');
                    });
                    e.target.classList.add('active');
                    
                    // Меняем интервал
                    currentInterval = newInterval;
                    
                    // Загружаем новые данные
                    loadHistoricalData();
                }
            }
            
            /**
             * Форматирование отображения символа
             */
            function formatSymbolDisplay(symbol) {
                return symbol.replace('USDT', '/USDT');
            }
            
            /**
             * Инициализация приложения
             */
            function init() {
                // Инициализация графика
                initChart();
                
                // Загрузка данных
                loadHistoricalData();
                
                // Установка обработчиков событий
                elements.symbolSelect.addEventListener('change', handleSymbolChange);
                
                elements.timeframeButtons.forEach(btn => {
                    btn.addEventListener('click', handleIntervalChange);
                });
            }
            
            // Публичный API
            return {
                init: init
            };
        })();
        
        // Запуск приложения при загрузке страницы
        document.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
