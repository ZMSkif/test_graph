<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoView</title>
  <!-- Tailwind CSS через CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lightweight Charts через CDN -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="bg-gray-900 text-white h-screen">
  <!-- Заголовок и панель управления -->
  <div class="p-4 bg-gray-800">
    <h1 class="text-center text-xl font-bold">CryptoView</h1>
  </div>
  <div class="p-4 bg-gray-700 flex justify-between items-center">
    <select id="symbolSelect" class="bg-gray-800 border border-gray-600 rounded px-2 py-1">
      <option value="BTCUSDT">BTC/USDT</option>
      <option value="ETHUSDT">ETH/USDT</option>
      <option value="BNBUSDT">BNB/USDT</option>
      <option value="SOLUSDT">SOL/USDT</option>
      <option value="DOGEUSDT">DOGE/USDT</option>
    </select>
    <div class="space-x-2">
      <button class="timeframe-btn bg-gray-800 border border-gray-600 rounded px-2 py-1" data-interval="1m">1м</button>
      <button class="timeframe-btn bg-gray-800 border border-gray-600 rounded px-2 py-1" data-interval="5m">5м</button>
      <button class="timeframe-btn bg-blue-600 text-white border border-gray-600 rounded px-2 py-1" data-interval="15m">15м</button>
      <button class="timeframe-btn bg-gray-800 border border-gray-600 rounded px-2 py-1" data-interval="1h">1ч</button>
      <button class="timeframe-btn bg-gray-800 border border-gray-600 rounded px-2 py-1" data-interval="4h">4ч</button>
      <button class="timeframe-btn bg-gray-800 border border-gray-600 rounded px-2 py-1" data-interval="1d">1д</button>
    </div>
  </div>

  <!-- Контейнер для графика -->
  <div id="chart" class="relative" style="height: calc(100vh - 150px);">
    <!-- Оверлей для текущей цены -->
    <div class="absolute top-4 left-4 bg-gray-800 bg-opacity-75 p-2 rounded z-10">
      <div class="symbol-name font-semibold">BTC/USDT</div>
      <div class="current-price text-2xl font-bold">---</div>
      <div class="price-change">0 (0%)</div>
    </div>
    <!-- Сообщение статуса -->
    <div id="statusMessage" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 bg-opacity-75 p-2 rounded text-sm">
      Загрузка данных...
    </div>
  </div>

  <script>
    (function() {
      // Основные переменные
      let chart, candleSeries;
      let currentSymbol = 'BTCUSDT';
      let currentInterval = '15m';
      let webSocket = null;
      let lastCandle = null;

      // Получаем DOM-элементы
      const elements = {
        chartContainer: document.getElementById('chart'),
        symbolName: document.querySelector('.symbol-name'),
        currentPrice: document.querySelector('.current-price'),
        priceChange: document.querySelector('.price-change'),
        statusMessage: document.getElementById('statusMessage'),
        symbolSelect: document.getElementById('symbolSelect'),
        timeframeButtons: document.querySelectorAll('.timeframe-btn')
      };

      // Инициализация графика с дефолтными настройками
      function initChart() {
        const options = {
          width: elements.chartContainer.clientWidth,
          height: elements.chartContainer.clientHeight,
          layout: {
            background: { color: '#0f1729' },
            textColor: '#e6e9f0'
          },
          grid: {
            vertLines: { color: 'rgba(42,54,82,0.5)' },
            horzLines: { color: 'rgba(42,54,82,0.5)' }
          },
          timeScale: {
            timeVisible: true,
            secondsVisible: false,
            borderColor: '#2a3652'
          }
        };
        chart = LightweightCharts.createChart(elements.chartContainer, options);
        candleSeries = chart.addCandlestickSeries();
        window.addEventListener('resize', () => {
          chart.resize(elements.chartContainer.clientWidth, elements.chartContainer.clientHeight);
        });
      }

      // Загрузка исторических данных через Binance REST API
      async function loadHistoricalData() {
        setStatus('Загрузка данных...', true);
        try {
          const url = `https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${currentInterval}&limit=200`;
          const response = await fetch(url);
          if (!response.ok) throw new Error('HTTP Error: ' + response.status);
          const data = await response.json();
          if (!data || !Array.isArray(data) || data.length === 0) throw new Error('Invalid data');
          const candles = data.map(item => ({
            time: Math.floor(item[0] / 1000),
            open: parseFloat(item[1]),
            high: parseFloat(item[2]),
            low: parseFloat(item[3]),
            close: parseFloat(item[4])
          }));
          candleSeries.setData(candles);
          lastCandle = candles[candles.length - 1];
          updatePriceInfo(lastCandle);
          connectWebSocket();
          chart.timeScale().fitContent();
          setStatus('', false);
        } catch (err) {
          console.error(err);
          setStatus('Ошибка загрузки', true);
          setTimeout(loadHistoricalData, 5000);
        }
      }

      // Подключение к Binance WebSocket для live-обновлений
      function connectWebSocket() {
        if (webSocket) webSocket.close();
        const wsUrl = `wss://stream.binance.com:9443/ws/${currentSymbol.toLowerCase()}@kline_${currentInterval}`;
        webSocket = new WebSocket(wsUrl);
        webSocket.onopen = () => { console.log('WS connected'); };
        webSocket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.k) {
              const k = data.k;
              const candle = {
                time: Math.floor(k.t / 1000),
                open: parseFloat(k.o),
                high: parseFloat(k.h),
                low: parseFloat(k.l),
                close: parseFloat(k.c)
              };
              // Если время свечи совпадает, обновляем её; иначе – обновляем и сохраняем как последнюю
              if (lastCandle && candle.time === lastCandle.time) {
                candleSeries.update(candle);
              } else {
                candleSeries.update(candle);
                lastCandle = candle;
              }
              updatePriceInfo(candle);
            }
          } catch (e) {
            console.error(e);
          }
        };
        webSocket.onerror = (e) => {
          console.error('WS error', e);
          setStatus('WS error', true);
        };
        webSocket.onclose = () => {
          console.log('WS closed, reconnecting');
          setTimeout(connectWebSocket, 3000);
        };
      }

      // Обновление оверлея с текущей ценой
      function updatePriceInfo(candle) {
        if (!candle) return;
        const precision = currentSymbol.includes('BTC') || currentSymbol.includes('ETH') ? 2 : 4;
        const formattedPrice = candle.close.toFixed(precision);
        const diff = candle.close - candle.open;
        const percent = ((diff / candle.open) * 100).toFixed(2);
        elements.currentPrice.textContent = formattedPrice;
        elements.priceChange.textContent = (diff >= 0 ? '+' : '') + diff.toFixed(precision) + ' (' + (diff >= 0 ? '+' : '') + percent + '%)';
      }

      // Управление статусным сообщением
      function setStatus(msg, show) {
        elements.statusMessage.textContent = msg;
        elements.statusMessage.style.display = show ? 'block' : 'none';
      }

      // Обработчик смены символа
      function handleSymbolChange(e) {
        const newSymbol = e.target.value;
        if (newSymbol !== currentSymbol) {
          currentSymbol = newSymbol;
          elements.symbolName.textContent = newSymbol.replace('USDT', '/USDT');
          loadHistoricalData();
        }
      }

      // Обработчик смены таймфрейма
      function handleTimeframeChange(e) {
        const newInterval = e.target.getAttribute('data-interval');
        if (newInterval !== currentInterval) {
          // Обновляем визуальное выделение кнопок
          elements.timeframeButtons.forEach(btn => btn.classList.remove('bg-blue-600', 'text-white'));
          e.target.classList.add('bg-blue-600', 'text-white');
          currentInterval = newInterval;
          loadHistoricalData();
        }
      }

      // Инициализация приложения
      function init() {
        initChart();
        loadHistoricalData();
        elements.symbolSelect.addEventListener('change', handleSymbolChange);
        elements.timeframeButtons.forEach(btn => {
          btn.addEventListener('click', handleTimeframeChange);
        });
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
