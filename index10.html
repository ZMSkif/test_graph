<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/3.8.0/lightweight-charts.standalone.production.min.js"></script>
</head>
<body class="bg-black text-white font-sans h-screen overflow-hidden">
    <!-- Заголовок -->
    <header class="px-4 py-3 flex justify-between items-center border-b border-gray-800">
        <h1 class="text-lg font-semibold">Trade Platform</h1>
        <div class="flex gap-2">
            <button id="symbol-dropdown" class="bg-gray-800 text-sm rounded px-3 py-2 flex items-center gap-1">
                <span id="current-symbol">BTC/USDT</span>
                <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
            <button id="interval-dropdown" class="bg-gray-800 text-sm rounded px-3 py-2 flex items-center gap-1">
                <span id="current-interval">1m</span>
                <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </div>
    </header>
    
    <!-- Тайм-бар -->
    <div class="flex bg-gray-900 border-b border-gray-800 overflow-x-auto scrollbar-hide">
        <button class="timeframe-button px-4 py-2 text-sm focus:outline-none active" data-interval="1m">1M</button>
        <button class="timeframe-button px-4 py-2 text-sm focus:outline-none" data-interval="5m">5M</button>
        <button class="timeframe-button px-4 py-2 text-sm focus:outline-none" data-interval="15m">15M</button>
        <button class="timeframe-button px-4 py-2 text-sm focus:outline-none" data-interval="1h">1H</button>
        <button class="timeframe-button px-4 py-2 text-sm focus:outline-none" data-interval="4h">4H</button>
        <button class="timeframe-button px-4 py-2 text-sm focus:outline-none" data-interval="1d">1D</button>
    </div>
    
    <!-- График -->
    <div id="chart" class="w-full h-[calc(100vh-142px)] relative">
        <div id="chart-loader" class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50">
            <div class="w-8 h-8 border-4 border-gray-600 border-t-blue-500 rounded-full animate-spin"></div>
        </div>
    </div>
    
    <!-- Информация о цене -->
    <div class="grid grid-cols-3 p-3 bg-gray-900 border-t border-gray-800">
        <div>
            <div class="text-xs text-gray-400">Цена</div>
            <div id="price" class="text-base font-medium">--</div>
        </div>
        <div>
            <div class="text-xs text-gray-400">24ч %</div>
            <div id="change" class="text-base font-medium">--</div>
        </div>
        <div>
            <div class="text-xs text-gray-400">Объем 24ч</div>
            <div id="volume" class="text-base font-medium">--</div>
        </div>
    </div>
    
    <!-- Модальные окна -->
    <div id="symbol-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex-col justify-center items-center hidden">
        <div class="bg-gray-900 mx-auto mt-16 rounded-lg w-11/12 max-w-md overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b border-gray-800">
                <h3 class="text-lg font-medium">Выберите пару</h3>
                <button class="modal-close text-gray-400 text-xl">&times;</button>
            </div>
            <div class="p-2 max-h-96 overflow-y-auto">
                <button class="pair-item w-full text-left p-3 hover:bg-gray-800 rounded-md mb-1" data-symbol="BTCUSDT">BTC/USDT</button>
                <button class="pair-item w-full text-left p-3 hover:bg-gray-800 rounded-md mb-1" data-symbol="ETHUSDT">ETH/USDT</button>
                <button class="pair-item w-full text-left p-3 hover:bg-gray-800 rounded-md mb-1" data-symbol="BNBUSDT">BNB/USDT</button>
                <button class="pair-item w-full text-left p-3 hover:bg-gray-800 rounded-md mb-1" data-symbol="SOLUSDT">SOL/USDT</button>
                <button class="pair-item w-full text-left p-3 hover:bg-gray-800 rounded-md mb-1" data-symbol="ADAUSDT">ADA/USDT</button>
                <button class="pair-item w-full text-left p-3 hover:bg-gray-800 rounded-md mb-1" data-symbol="XRPUSDT">XRP/USDT</button>
                <button class="pair-item w-full text-left p-3 hover:bg-gray-800 rounded-md mb-1" data-symbol="DOGEUSDT">DOGE/USDT</button>
            </div>
        </div>
    </div>
    
    <div id="interval-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex-col justify-center items-center hidden">
        <div class="bg-gray-900 mx-auto mt-16 rounded-lg w-11/12 max-w-md overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b border-gray-800">
                <h3 class="text-lg font-medium">Выберите интервал</h3>
                <button class="modal-close text-gray-400 text-xl">&times;</button>
            </div>
            <div class="p-2">
                <div class="grid grid-cols-2 gap-2">
                    <button class="interval-item p-3 hover:bg-gray-800 rounded-md" data-interval="1m">1 минута</button>
                    <button class="interval-item p-3 hover:bg-gray-800 rounded-md" data-interval="5m">5 минут</button>
                    <button class="interval-item p-3 hover:bg-gray-800 rounded-md" data-interval="15m">15 минут</button>
                    <button class="interval-item p-3 hover:bg-gray-800 rounded-md" data-interval="1h">1 час</button>
                    <button class="interval-item p-3 hover:bg-gray-800 rounded-md" data-interval="4h">4 часа</button>
                    <button class="interval-item p-3 hover:bg-gray-800 rounded-md" data-interval="1d">1 день</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CSS для активной кнопки таймфрейма
        document.head.insertAdjacentHTML('beforeend', `
            <style>
                .timeframe-button.active {
                    color: #3b82f6;
                    position: relative;
                }
                .timeframe-button.active::after {
                    content: '';
                    position: absolute;
                    left: 25%;
                    right: 25%;
                    bottom: 0;
                    height: 2px;
                    background-color: #3b82f6;
                }
                .scrollbar-hide::-webkit-scrollbar {
                    display: none;
                }
                .scrollbar-hide {
                    -ms-overflow-style: none;
                    scrollbar-width: none;
                }
            </style>
        `);

        // Основные переменные
        let chart;
        let candleSeries;
        let currentSymbol = 'BTCUSDT';
        let currentInterval = '1m';
        let priceDataBySymbol = {};
        let socket;
        let symbolInfoSocket = {};

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            initChart();
            setupEventListeners();
            loadHistoricalData();
            setupTickersSockets();
        });

        // Инициализация графика
        function initChart() {
            const chartElement = document.getElementById('chart');
            
            chart = LightweightCharts.createChart(chartElement, {
                width: chartElement.clientWidth,
                height: chartElement.clientHeight,
                layout: {
                    backgroundColor: '#000000',
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: {
                        color: 'rgba(42, 46, 57, 0.2)',
                    },
                    horzLines: {
                        color: 'rgba(42, 46, 57, 0.2)',
                    },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                priceScale: {
                    borderColor: 'rgba(197, 203, 206, 0.3)',
                },
                timeScale: {
                    borderColor: 'rgba(197, 203, 206, 0.3)',
                    timeVisible: true,
                    secondsVisible: false,
                },
                handleScale: {
                    mouseWheel: true,
                    pinch: true,
                },
                handleScroll: {
                    mouseWheel: true,
                    pressedMouseMove: true,
                    horzTouchDrag: true,
                    vertTouchDrag: true,
                },
            });
            
            // Добавляем свечной график
            candleSeries = chart.addCandlestickSeries({
                upColor: '#4caf50',
                downColor: '#ef4444',
                borderDownColor: '#ef4444',
                borderUpColor: '#4caf50',
                wickDownColor: '#ef4444',
                wickUpColor: '#4caf50',
            });
            
            // Адаптивность графика при изменении размера окна
            window.addEventListener('resize', () => {
                if (chart) {
                    chart.resize(
                        chartElement.clientWidth,
                        chartElement.clientHeight
                    );
                }
            });
        }
        
        // Настройка обработчиков событий
        function setupEventListeners() {
            // Открытие селектора символа
            document.getElementById('symbol-dropdown').addEventListener('click', function() {
                document.getElementById('symbol-modal').classList.remove('hidden');
                document.getElementById('symbol-modal').classList.add('flex');
            });
            
            // Открытие селектора интервала
            document.getElementById('interval-dropdown').addEventListener('click', function() {
                document.getElementById('interval-modal').classList.remove('hidden');
                document.getElementById('interval-modal').classList.add('flex');
            });
            
            // Закрытие модальных окон
            document.querySelectorAll('.modal-close').forEach(button => {
                button.addEventListener('click', function() {
                    this.closest('[id$="-modal"]').classList.add('hidden');
                    this.closest('[id$="-modal"]').classList.remove('flex');
                });
            });
            
            // Выбор символа
            document.querySelectorAll('.pair-item').forEach(item => {
                item.addEventListener('click', function() {
                    const symbol = this.getAttribute('data-symbol');
                    const displaySymbol = symbol.replace('USDT', '/USDT');
                    
                    document.getElementById('current-symbol').textContent = displaySymbol;
                    document.getElementById('symbol-modal').classList.add('hidden');
                    document.getElementById('symbol-modal').classList.remove('flex');
                    
                    if (currentSymbol !== symbol) {
                        currentSymbol = symbol;
                        document.getElementById('chart-loader').classList.remove('hidden');
                        loadHistoricalData();
                    }
                });
            });
            
            // Выбор интервала из модального окна
            document.querySelectorAll('.interval-item').forEach(item => {
                item.addEventListener('click', function() {
                    const interval = this.getAttribute('data-interval');
                    
                    document.getElementById('current-interval').textContent = interval;
                    document.getElementById('interval-modal').classList.add('hidden');
                    document.getElementById('interval-modal').classList.remove('flex');
                    
                    if (currentInterval !== interval) {
                        currentInterval = interval;
                        
                        // Обновить активную кнопку на таймфрейм баре
                        document.querySelectorAll('.timeframe-button').forEach(button => {
                            if (button.getAttribute('data-interval') === interval) {
                                button.classList.add('active');
                            } else {
                                button.classList.remove('active');
                            }
                        });
                        
                        document.getElementById('chart-loader').classList.remove('hidden');
                        loadHistoricalData();
                    }
                });
            });
            
            // Выбор интервала на таймфрейм баре
            document.querySelectorAll('.timeframe-button').forEach(button => {
                button.addEventListener('click', function() {
                    const interval = this.getAttribute('data-interval');
                    
                    document.querySelectorAll('.timeframe-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    
                    this.classList.add('active');
                    document.getElementById('current-interval').textContent = interval;
                    
                    if (currentInterval !== interval) {
                        currentInterval = interval;
                        document.getElementById('chart-loader').classList.remove('hidden');
                        loadHistoricalData();
                    }
                });
            });
            
            // Закрытие модальных окон по клику вне них
            document.querySelectorAll('[id$="-modal"]').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.add('hidden');
                        this.classList.remove('flex');
                    }
                });
            });
        }
        
        // Загрузка исторических данных
        function loadHistoricalData() {
            const binanceInterval = convertToBinanceInterval(currentInterval);
            
            fetch(`https://api.binance.com/api/v3/klines?symbol=${currentSymbol}&interval=${binanceInterval}&limit=500`)
                .then(response => response.json())
                .then(data => {
                    const formattedData = data.map(item => ({
                        time: item[0] / 1000,
                        open: parseFloat(item[1]),
                        high: parseFloat(item[2]),
                        low: parseFloat(item[3]),
                        close: parseFloat(item[4]),
                        volume: parseFloat(item[5])
                    }));
                    
                    // Устанавливаем данные на график
                    candleSeries.setData(formattedData);
                    
                    // Подписываемся на обновления в реальном времени
                    subscribeToRealtimeUpdates();
                    
                    // Обновляем информацию о цене
                    if (formattedData.length > 0) {
                        const latestCandle = formattedData[formattedData.length - 1];
                        updatePriceInfo(latestCandle.close);
                    }
                    
                    // Скрыть лоадер
                    document.getElementById('chart-loader').classList.add('hidden');
                })
                .catch(error => {
                    console.error('Error loading historical data:', error);
                    document.getElementById('chart-loader').classList.add('hidden');
                });
        }
        
        // Подписка на обновления в реальном времени
        function subscribeToRealtimeUpdates() {
            // Закрываем предыдущее соединение, если оно открыто
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }
            
            const binanceInterval = convertToBinanceInterval(currentInterval);
            const wsUrl = `wss://stream.binance.com:9443/ws/${currentSymbol.toLowerCase()}@kline_${binanceInterval}`;
            
            socket = new WebSocket(wsUrl);
            
            socket.onopen = function() {
                console.log('WebSocket connection established');
            };
            
            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.k) {
                    const candle = {
                        time: data.k.t / 1000,
                        open: parseFloat(data.k.o),
                        high: parseFloat(data.k.h),
                        low: parseFloat(data.k.l),
                        close: parseFloat(data.k.c),
                        volume: parseFloat(data.k.v)
                    };
                    
                    // Обновляем свечу на графике
                    candleSeries.update(candle);
                    
                    // Обновляем информацию о цене
                    updatePriceInfo(candle.close);
                }
            };
            
            socket.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
            
            socket.onclose = function() {
                console.log('WebSocket connection closed');
            };
        }
        
        // Настройка сокетов для получения информации о символах
        function setupTickersSockets() {
            const symbols = ['btcusdt', 'ethusdt', 'bnbusdt', 'solusdt', 'adausdt', 'xrpusdt', 'dogeusdt'];
            
            symbols.forEach(symbol => {
                const ticker = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@ticker`);
                
                ticker.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    const upperSymbol = symbol.toUpperCase();
                    
                    priceDataBySymbol[upperSymbol] = {
                        price: parseFloat(data.c),
                        change: parseFloat(data.P),
                        volume: parseFloat(data.v)
                    };
                    
                    // Если это текущий выбранный символ, обновляем информацию
                    if (upperSymbol === currentSymbol) {
                        updateTickerInfo();
                    }
                };
                
                symbolInfoSocket[symbol] = ticker;
            });
        }
        
        // Обновление информации о цене
        function updatePriceInfo(price) {
            document.getElementById('price').textContent = price.toFixed(price >= 1000 ? 2 : (price >= 1 ? 3 : 6));
        }
        
        // Обновление информации о тикере
        function updateTickerInfo() {
            const data = priceDataBySymbol[currentSymbol];
            
            if (!data) return;
            
            const priceElement = document.getElementById('price');
            const changeElement = document.getElementById('change');
            const volumeElement = document.getElementById('volume');
            
            // Обновляем цену
            priceElement.textContent = data.price.toFixed(data.price >= 1000 ? 2 : (data.price >= 1 ? 3 : 6));
            
            // Обновляем изменение
            const change = data.change;
            changeElement.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
            
            if (change >= 0) {
                changeElement.className = 'text-base font-medium text-green-500';
            } else {
                changeElement.className = 'text-base font-medium text-red-500';
            }
            
            // Обновляем объем
            const volume = data.volume;
            let formattedVolume;
            
            if (volume >= 1000000000) {
                formattedVolume = (volume / 1000000000).toFixed(2) + ' B';
            } else if (volume >= 1000000) {
                formattedVolume = (volume / 1000000).toFixed(2) + ' M';
            } else if (volume >= 1000) {
                formattedVolume = (volume / 1000).toFixed(2) + ' K';
            } else {
                formattedVolume = volume.toFixed(2);
            }
            
            volumeElement.textContent = formattedVolume;
        }
        
        // Преобразование интервала в формат Binance API
        function convertToBinanceInterval(interval) {
            switch (interval) {
                case '1m': return '1m';
                case '5m': return '5m';
                case '15m': return '15m';
                case '1h': return '1h';
                case '4h': return '4h';
                case '1d': return '1d';
                default: return '1m';
            }
        }
        
        // Очистка ресурсов при закрытии страницы
        window.addEventListener('beforeunload', function() {
            // Закрываем основной сокет
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }
            
            // Закрываем сокеты информации о символах
            for (const symbol in symbolInfoSocket) {
                if (symbolInfoSocket[symbol] && symbolInfoSocket[symbol].readyState === WebSocket.OPEN) {
                    symbolInfoSocket[symbol].close();
                }
            }
        });
    </script>
</body>
</html>
