<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Свечной график TradingView</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; }
        #chart { width: 100%; height: calc(100% - 100px); }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="flex items-center justify-between bg-gray-800 px-4 py-3">
        <div class="text-xl font-semibold">TradingView Chart</div>
        <select id="symbolSelect" class="bg-gray-700 px-2 py-1 rounded text-white">
            <option value="BTCUSDT">BTC/USDT</option>
            <option value="ETHUSDT">ETH/USDT</option>
            <option value="BNBUSDT">BNB/USDT</option>
        </select>
    </div>
    <div class="flex justify-center bg-gray-800 py-2">
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="1m">1м</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="5m">5м</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-blue-600" data-interval="15m">15м</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="1h">1ч</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="4h">4ч</button>
        <button class="timeframe-btn mx-1 px-3 py-1 rounded bg-gray-700 hover:bg-blue-500 transition" data-interval="1d">1д</button>
    </div>
    <div id="chart"></div>

    <script>
        // Инициализация графика
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' }
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
            borderVisible: false
        });

        // Функция загрузки данных
        async function loadChart(symbol, interval) {
            try {
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=200`);
                if (!response.ok) throw new Error('Ошибка загрузки данных');
                const data = await response.json();

                const candles = data.map(d => ({
                    time: Math.floor(d[0] / 1000), // Убедимся, что время в секундах
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                candleSeries.setData(candles);
                chart.timeScale().fitContent();
            } catch (error) {
                console.error('Ошибка:', error);
                candleSeries.setData([]); // Очистка графика при ошибке
            }
        }

        // Начальные значения
        let currentSymbol = 'BTCUSDT';
        let currentInterval = '15m';

        // Обработчик выбора символа
        document.getElementById('symbolSelect').addEventListener('change', (e) => {
            currentSymbol = e.target.value;
            loadChart(currentSymbol, currentInterval);
        });

        // Обработчик кнопок таймфрейма
        document.querySelectorAll('.timeframe-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.replace('bg-blue-600', 'bg-gray-700'));
                btn.classList.replace('bg-gray-700', 'bg-blue-600');
                currentInterval = btn.dataset.interval;
                loadChart(currentSymbol, currentInterval);
            });
        });

        // Обработчик изменения размера окна
        const resizeChart = () => {
            const chartContainer = document.getElementById('chart');
            chart.resize(chartContainer.clientWidth, chartContainer.clientHeight);
        };
        window.addEventListener('resize', resizeChart);

        // Начальная загрузка
        loadChart(currentSymbol, currentInterval);
    </script>
</body>
</html>
